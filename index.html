
<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b3f8f">
  <title>Fitness Village - Check-in</title>
  <style>
    :root { --blue:#0b3f8f; --blue2:#1269d3; --yellow:#ffd51e; --ink:#0b2b5a; }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; font-family:Arial,Helvetica,sans-serif; }
    body {
      min-height:100vh; display:flex; justify-content:center; align-items:center; padding:18px; color:var(--ink);
      background:
        radial-gradient(circle at 0% 0%, rgba(255,213,30,.95), rgba(255,213,30,.38) 25%, transparent 44%),
        radial-gradient(circle at 100% 100%, rgba(11,63,143,.92), rgba(11,63,143,.35) 28%, transparent 46%),
        linear-gradient(135deg,#fff7c9 0%,#fff 48%,#e6f0ff 100%);
    }
    .card {
      width:min(100%,460px); background:#fff; border:4px solid var(--blue); border-radius:30px;
      padding:22px 22px 26px; text-align:center; box-shadow:0 18px 50px rgba(5,35,80,.22);
    }
    .logo { display:block; width:220px; max-width:72%; height:auto; margin:0 auto 10px; }
    h1 { margin:8px 0 6px; font-size:31px; line-height:1.08; }
    .sub { margin:0 0 22px; color:#657387; font-size:15px; }
    .choice {
      width:100%; min-height:84px; border:0; border-radius:19px; margin:10px 0; padding:18px 20px;
      font-size:24px; font-weight:800; cursor:pointer; box-shadow:0 8px 20px rgba(0,0,0,.14);
    }
    .choice:active { transform:scale(.985); }
    .weights { color:#fff; background:linear-gradient(135deg,var(--blue),var(--blue2)); }
    .courses { color:var(--ink); background:linear-gradient(135deg,#ffe86a,var(--yellow)); }
    .status {
      display:none; margin-top:18px; padding:20px 16px; border-radius:17px; background:#eef6ff;
      color:var(--blue); font-size:21px; font-weight:800;
    }
    .status.show { display:block; }
    .tag {
      display:inline-block; margin-top:15px; padding:8px 14px; border-radius:999px; background:var(--yellow);
      color:var(--blue); font-size:12px; font-weight:800; letter-spacing:.6px;
    }
    .foot { margin-top:16px; font-size:12px; line-height:1.4; color:#7a8796; }
    iframe { display:none; }
  </style>
</head>

  <script>
    let sent = false;
    function submitCheckin(activity) {
      if (sent) return;
      sent = true;
      const form = document.getElementById('checkinForm');
      const input = document.getElementById('activityInput');
      const status = document.getElementById('status');
      const buttons = document.querySelectorAll('.choice');
      input.value = activity;
      buttons.forEach(btn => { btn.disabled = true; btn.style.opacity = '.55'; });
      form.submit();
      setTimeout(() => {
        buttons.forEach(btn => btn.style.display = 'none');
        status.classList.add('show');
      }, 650);
    }
