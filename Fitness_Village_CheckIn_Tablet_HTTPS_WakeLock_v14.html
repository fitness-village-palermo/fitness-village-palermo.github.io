<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#082f6f">
<title>Fitness Village - Check-in</title>
<style>
:root{--blue:#0b3f8f;--blue2:#1675df;--blueDark:#072d69;--yellow:#ffd51e;--green:#198754;--ink:#0a2850;--muted:#64748b;}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
body{padding:6px;background:linear-gradient(135deg,#ffd51e 0 11%,#e9f2ff 11% 73%,#0b3f8f 73% 100%);color:var(--ink)}
.shell{width:100%;height:100%;background:linear-gradient(145deg,#dbeaff 0%,#f7fbff 46%,#fff0a8 100%);border-radius:24px;overflow:hidden;box-shadow:0 18px 50px rgba(4,35,82,.20);display:flex;flex-direction:column;position:relative}
.topbar{height:52px;flex:0 0 52px;background:var(--blueDark);color:white;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.datetime{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.datetime strong{font-size:22px;letter-spacing:.02em}
.datetime span{font-size:13px;opacity:.86;font-weight:700}
.top-actions{display:flex;align-items:center;gap:12px}
.live{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:800}
.dot{width:9px;height:9px;border-radius:50%;background:#27cf77;box-shadow:0 0 0 5px rgba(39,207,119,.12);animation:blink 1.8s ease-in-out infinite}
.fullscreen-btn{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.10);color:#fff;border-radius:12px;padding:8px 11px;font-weight:800;font-size:11px;cursor:pointer}
.fullscreen-btn.hidden{display:none}
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(430px,63%) minmax(280px,37%);gap:18px;padding:16px 18px 14px;position:relative;background:radial-gradient(circle at 10% 18%,rgba(255,213,30,.40),transparent 26%),radial-gradient(circle at 87% 82%,rgba(11,63,143,.26),transparent 30%),linear-gradient(135deg,#dcecff 0%,#eef6ff 28%,#fff4b8 28%,#ffe36a 43%,#edf5ff 43%,#d6e8ff 100%)}
.main::before{content:'';position:absolute;left:62.6%;top:26px;bottom:26px;width:2px;background:linear-gradient(transparent,rgba(11,63,143,.18),rgba(11,63,143,.32),rgba(11,63,143,.18),transparent)}
.main::after{content:'';position:absolute;left:-7%;bottom:-28%;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(11,63,143,.15),rgba(11,63,143,0) 70%);pointer-events:none}
.left{min-width:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;text-align:left;padding:10px 34px 14px;position:relative;z-index:1;background:linear-gradient(145deg,rgba(255,255,255,.26),rgba(255,255,255,.06));border-radius:28px;gap:10px}
.brand-row{width:100%;display:flex;align-items:center;justify-content:flex-start;gap:26px;margin-bottom:4px}
.logo{display:block;width:clamp(175px,20vw,250px);max-height:175px;object-fit:contain;flex:0 0 auto;margin:0;border-radius:50%;clip-path:circle(49.6% at 50% 50%)}
.check-title{position:relative;margin:0;font-size:clamp(72px,7.8vw,112px);line-height:.86;font-weight:1000;letter-spacing:-.065em;color:var(--green);white-space:nowrap}
.check-title::after{content:'';display:block;width:72%;height:7px;background:var(--yellow);border-radius:999px;margin:12px 0 0}
.lead{margin:2px 0 2px;color:#4f6077;font-size:clamp(22px,2.1vw,28px);font-weight:750}
.lead strong{color:var(--ink)}
.question{display:flex;align-items:center;justify-content:flex-start;gap:14px;margin:3px 0 5px;font-size:clamp(30px,2.8vw,38px);font-weight:950;color:var(--ink);line-height:1.05}
.question .arrow{font-size:clamp(32px,3vw,40px);color:var(--green);animation:nudge 1.5s ease-in-out infinite}
.steps{width:min(100%,560px);display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:2px 0 6px}
.step{background:rgba(255,255,255,.78);border:1px solid rgba(11,63,143,.14);border-radius:17px;padding:12px 12px;font-size:clamp(14px,1.45vw,18px);font-weight:850;color:#53657d;box-shadow:0 6px 16px rgba(11,63,143,.06)}
.step b{display:inline-flex;width:29px;height:29px;align-items:center;justify-content:center;border-radius:50%;background:var(--blue);color:#fff;margin-right:8px;font-size:14px}
.why{margin-top:2px;font-size:clamp(15px,1.45vw,19px);line-height:1.32;color:#4f6075;max-width:610px;font-weight:650;text-align:left}
.privacy{margin-top:2px;font-size:clamp(12px,1.15vw,15px);font-weight:650;color:#718097}
.right{min-width:0;display:flex;align-items:center;justify-content:center;padding:8px 8px 8px 14px;position:relative;z-index:1}
.choices{width:min(100%,400px);height:100%;display:grid;grid-template-rows:1fr 1fr;gap:18px}
.choice{border:0;border-radius:32px;padding:20px 20px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:950;box-shadow:0 16px 34px rgba(6,39,88,.22),0 0 0 3px rgba(255,255,255,.42) inset;transition:transform .15s ease,box-shadow .15s ease;touch-action:manipulation;position:relative}
.choice:active{transform:scale(.985)}
.choice .icon{font-size:clamp(64px,6.8vw,90px);line-height:1}
.choice .label{font-size:clamp(46px,5vw,66px);line-height:1;font-weight:1000;letter-spacing:-.03em}
.choice .hint{margin-top:5px;border-radius:999px;padding:9px 15px;font-size:15px;font-weight:950;background:rgba(255,255,255,.22);box-shadow:0 4px 12px rgba(0,0,0,.06)}
.weights{background:linear-gradient(145deg,#06285f,var(--blue),#1a7bea);color:#fff;box-shadow:0 18px 38px rgba(6,45,105,.30),0 0 0 3px rgba(255,255,255,.38) inset}
.courses{background:linear-gradient(145deg,#fff8b8,#ffe04a 48%,var(--yellow));color:var(--blueDark);box-shadow:0 18px 38px rgba(184,146,0,.20),0 0 0 3px rgba(255,255,255,.55) inset}
.courses .hint{background:rgba(255,255,255,.38)}
.success{position:absolute;inset:52px 0 0;z-index:10;display:grid;grid-template-columns:minmax(180px,30%) minmax(0,1fr);grid-template-rows:auto auto auto auto;grid-template-areas:'check title' 'check thanks' 'check selected' 'check bar';align-content:center;justify-items:center;column-gap:34px;row-gap:10px;padding:28px 50px;background:radial-gradient(circle at 18% 18%,rgba(255,213,30,.42),transparent 24%),radial-gradient(circle at 84% 80%,rgba(11,63,143,.17),transparent 26%),linear-gradient(145deg,#eef6ff,#fff7be);opacity:0;pointer-events:none;transform:scale(.97);transition:opacity .22s ease,transform .22s ease}
.success.show{opacity:1;pointer-events:auto;transform:scale(1);animation:successIn .34s ease both}
.success.leaving{animation:successOut .3s ease both}
.checkmark{grid-area:check;width:clamp(130px,16vw,178px);height:clamp(130px,16vw,178px);border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#23c46f,#178f56);color:white;font-size:clamp(72px,9vw,104px);font-weight:1000;box-shadow:0 18px 38px rgba(25,135,84,.24)}
.success h2{grid-area:title;margin:0;align-self:end;color:var(--blueDark);font-size:clamp(48px,5.7vw,72px);line-height:.98;text-align:center}
.success .thanks{grid-area:thanks;margin:0;font-size:clamp(23px,2.6vw,32px);font-weight:800;color:#536278;text-align:center}
.selected{grid-area:selected;margin:7px 0 0;padding:12px 22px;border-radius:999px;background:linear-gradient(90deg,#ffe86d,var(--yellow));color:var(--blueDark);font-size:clamp(25px,3vw,36px);font-weight:950;text-align:center}
.reset-bar{grid-area:bar;width:min(360px,70%);height:11px;border-radius:999px;background:rgba(11,63,143,.10);overflow:hidden;margin:17px auto 0;justify-self:center}
.reset-bar span{display:block;width:100%;height:100%;background:linear-gradient(90deg,#1fb66b,#ffd51e 72%,#0b3f8f);transform-origin:left center;animation:countdown 3s linear forwards}
.returning .left,.returning .right{animation:returnIn .62s cubic-bezier(.18,.82,.22,1) both}
.returning .right{animation-delay:.08s}
iframe{display:none}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(7px)}}
@keyframes successIn{0%{opacity:0;transform:scale(.95) translateY(8px)}70%{opacity:1;transform:scale(1.01)}100%{opacity:1;transform:scale(1)}}
@keyframes successOut{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.035)}}
@keyframes countdown{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@keyframes returnIn{0%{opacity:0;transform:translateY(16px) scale(.985)}70%{opacity:1;transform:translateY(-2px) scale(1.003)}100%{opacity:1;transform:none}}
@media (orientation:portrait){
 body{overflow:auto;padding:8px}
 .left{align-items:center;text-align:center;gap:6px}
 .brand-row{flex-direction:column;gap:4px;margin-bottom:2px}
 .check-title{margin-left:auto;margin-right:auto}
 .check-title::after{margin-left:auto;margin-right:auto}
 .question{justify-content:center}
 .steps{margin-left:auto;margin-right:auto}
 .why{text-align:center}
 .shell{height:auto;min-height:calc(100dvh - 16px)}
 .main{display:flex;flex-direction:column;gap:10px;padding:12px 14px 18px}
 .main::before{display:none}
 .left{padding:0 8px}
 .logo{width:min(230px,60vw);margin:0 auto}
 .check-title{font-size:clamp(56px,15vw,82px)}
 .lead{font-size:20px}
 .question{font-size:24px}
 .question .arrow{transform:rotate(90deg);animation:none}
 .right{width:100%;padding:0}
 .choices{width:100%;height:auto;grid-template-rows:none;gap:12px}
 .choice{min-height:165px;border-radius:25px}
 .choice .icon{font-size:58px}
 .choice .label{font-size:42px}
 .success{inset:52px 0 0;display:flex;flex-direction:column;justify-content:center;gap:9px;padding:24px}
 .checkmark{width:120px;height:120px;font-size:70px}
 .success h2{font-size:48px}
 .selected{font-size:26px}
 .reset-bar{width:min(320px,78%);margin-top:15px}
}
@media (orientation:landscape) and (max-height:560px){
 .topbar{height:46px;flex-basis:46px;padding:6px 14px}
 .success{inset:46px 0 0}
 .main{grid-template-columns:minmax(420px,63%) minmax(270px,37%);padding:8px 14px 8px;gap:14px}
 .left{padding:6px 26px 8px;gap:6px}
 .brand-row{gap:18px;margin-bottom:0}
 .logo{width:clamp(145px,17vw,185px);max-height:126px;margin:0}
 .check-title{font-size:clamp(58px,6.8vw,76px);margin:0}
 .check-title::after{height:5px;margin-top:7px;width:76%}
 .lead{font-size:18px;margin:0 0 1px}
 .question{font-size:25px;margin:1px 0 3px;gap:10px}
 .question .arrow{font-size:28px}
 .steps{width:min(100%,470px);gap:8px;margin:0 0 3px}
 .step{padding:7px 8px;font-size:12.5px;border-radius:13px}
 .step b{width:24px;height:24px;font-size:12px;margin-right:5px}
 .why{font-size:12.5px;line-height:1.25;margin-top:0;max-width:520px}
 .privacy{font-size:11px;margin-top:1px}
 .right{padding:2px 8px 2px 14px}
 .choices{width:min(100%,360px);gap:11px}
 .choice{border-radius:24px;padding:10px 16px;gap:3px}
 .choice .icon{font-size:54px}
 .choice .label{font-size:42px}
 .choice .hint{font-size:12px;padding:6px 10px}
 .success{padding:18px 38px;column-gap:26px;row-gap:6px}
 .checkmark{width:122px;height:122px;font-size:72px}
 .success h2{font-size:50px}
 .success .thanks{font-size:22px}
 .selected{font-size:24px;padding:9px 18px;margin-top:4px}
 .reset-bar{width:min(310px,64%);margin-top:10px;height:9px}
}


/* Rifinitura landscape v3: logo circolare e CHECK-IN più vicino */
@media (orientation:landscape){
  .left{
    align-items:center;
    text-align:center;
    padding:10px 34px 14px;
    gap:12px;
  }
  .brand-row{
    justify-content:center;
    gap:10px;
    margin-bottom:6px;
  }
  .logo{
    width:clamp(310px,30vw,420px);
    max-height:270px;
  }
  .check-title{
    font-size:clamp(74px,7.5vw,108px);
    transform:translateX(-4px);
  }
  .check-title::after{
    width:78%;
    margin:12px auto 0;
  }
  .lead{
    width:100%;
    font-size:clamp(26px,2.45vw,34px);
    text-align:center;
  }
  .question{
    width:100%;
    justify-content:center;
    font-size:clamp(34px,3.15vw,44px);
  }
  .question .arrow{
    font-size:clamp(46px,4.2vw,58px);
    line-height:.8;
  }
  .steps{
    width:min(96%,640px);
    margin:4px auto 8px;
    gap:14px;
  }
  .step{
    padding:14px 14px;
    font-size:clamp(16px,1.6vw,21px);
  }
  .step b{
    width:32px;
    height:32px;
    font-size:15px;
  }
  .why{
    max-width:680px;
    margin:2px auto 0;
    text-align:center;
    font-size:clamp(17px,1.58vw,21px);
  }
  .privacy{
    width:100%;
    text-align:center;
    font-size:clamp(13px,1.25vw,16px);
  }
}

@media (orientation:landscape) and (max-height:560px){
  .left{
    padding:4px 24px 6px;
    gap:6px;
  }
  .brand-row{
    justify-content:center;
    gap:8px;
    margin-bottom:1px;
  }
  .logo{
    width:clamp(245px,25vw,320px);
    max-height:188px;
  }
  .check-title{
    font-size:clamp(58px,6.5vw,76px);
    transform:translateX(-3px);
  }
  .check-title::after{
    height:5px;
    margin-top:7px;
    width:78%;
  }
  .lead{
    font-size:20px;
    margin:0;
  }
  .question{
    justify-content:center;
    font-size:28px;
    margin:1px 0 2px;
    gap:10px;
  }
  .question .arrow{
    font-size:40px;
    line-height:.8;
  }
  .steps{
    width:min(96%,520px);
    margin:0 auto 3px;
    gap:9px;
  }
  .step{
    padding:8px 9px;
    font-size:14px;
  }
  .step b{
    width:25px;
    height:25px;
    font-size:12px;
  }
  .why{
    max-width:560px;
    margin:0 auto;
    text-align:center;
    font-size:13.5px;
    line-height:1.25;
  }
  .privacy{
    text-align:center;
    font-size:11.5px;
    margin-top:1px;
  }
}

/* Rifinitura v7: logo completo senza riquadro + CHECK-IN più vicino */
.logo{
  border-radius:0 !important;
  clip-path:none !important;
  background:transparent !important;
}

@media (orientation:landscape){
  .brand-row{
    gap:0 !important;
  }
  .check-title{
    transform:translateX(-16px) !important;
  }
}

@media (orientation:landscape) and (max-height:560px){
  .brand-row{
    gap:0 !important;
  }
  .check-title{
    transform:translateX(-12px) !important;
  }
}


/* Rifinitura v8: logo ripulito, CHECK-IN più vicino, note secondarie più discrete */
@media (orientation:landscape){
  .check-title{
    transform:translateX(-30px) !important;
  }
  .why{
    font-size:clamp(13px,1.18vw,16px) !important;
    line-height:1.28 !important;
  }
  .privacy{
    font-size:clamp(10px,.92vw,12px) !important;
  }
}

@media (orientation:landscape) and (max-height:560px){
  .check-title{
    transform:translateX(-25px) !important;
  }
  .why{
    font-size:11.5px !important;
  }
  .privacy{
    font-size:9.5px !important;
  }
}


/* Rifinitura v9: logo più nitido, CHECK-IN più a sinistra, note più piccole */
@media (orientation:landscape){
  .brand-row{
    gap:4px;
  }
  .logo{
    width:clamp(320px,31vw,430px);
    max-height:280px;
    image-rendering:auto;
    transform:translateZ(0);
    filter:contrast(1.02) saturate(1.01);
  }
  .check-title{
    transform:translateX(-14px);
  }
  .lead{
    font-size:clamp(22px,2.05vw,29px);
  }
  .privacy{
    font-size:clamp(11px,1.02vw,13.5px);
  }
}

@media (orientation:landscape) and (max-height:560px){
  .brand-row{
    gap:3px;
  }
  .logo{
    width:clamp(258px,26vw,338px);
    max-height:198px;
    image-rendering:auto;
    transform:translateZ(0);
  }
  .check-title{
    transform:translateX(-12px);
  }
  .lead{
    font-size:17px;
  }
  .privacy{
    font-size:10.2px;
  }
}

/* Rifinitura v10: CHECK-IN ancora più a sinistra, note ancora più piccole */
@media (orientation:landscape){
  .check-title{
    transform:translateX(-24px);
  }
  .lead{
    font-size:clamp(20px,1.85vw,26px);
  }
  .privacy{
    font-size:clamp(10px,0.95vw,12.5px);
  }
}

@media (orientation:landscape) and (max-height:560px){
  .check-title{
    transform:translateX(-20px);
  }
  .lead{
    font-size:15.5px;
  }
  .privacy{
    font-size:9.5px;
  }
}

/* Rifinitura v11: override effettivo dei valori precedenti */
@media (orientation:landscape){
  .check-title{
    transform:translateX(-48px) !important;
  }
  .why{
    font-size:clamp(11.5px,1.02vw,13.5px) !important;
    line-height:1.20 !important;
  }
  .privacy{
    font-size:clamp(8.8px,.78vw,10.5px) !important;
    line-height:1.15 !important;
  }
}

@media (orientation:landscape) and (max-height:560px){
  .check-title{
    transform:translateX(-42px) !important;
  }
  .why{
    font-size:9.8px !important;
    line-height:1.18 !important;
  }
  .privacy{
    font-size:8px !important;
    line-height:1.12 !important;
  }
}


/* Rifinitura v12: rimosso il contorno esterno del logo */
.logo{
  border:none !important;
  outline:none !important;
  box-shadow:none !important;
  clip-path:none !important;
  border-radius:0 !important;
  background:transparent !important;
  filter:none !important;
}


/* Stato Wake Lock: utile per verificare sul tablet se Chrome lo ha davvero acquisito */
.wake-status{
  font-size:11px;
  font-weight:850;
  padding:7px 10px;
  border-radius:999px;
  white-space:nowrap;
  border:1px solid rgba(255,255,255,.22);
  background:rgba(255,255,255,.10);
  color:#fff;
}
.wake-status.ok{
  background:rgba(39,207,119,.18);
  border-color:rgba(39,207,119,.55);
}
.wake-status.warn{
  background:rgba(255,213,30,.18);
  border-color:rgba(255,213,30,.60);
}
@media (orientation:landscape) and (max-height:560px){
  .wake-status{font-size:9px;padding:5px 8px}
}

</style>
</head>
<body>
<main class="shell">
  <header class="topbar">
    <div class="datetime"><strong id="clock">--:--</strong><span id="dateDisplay">--/--/----</span></div>
    <div class="top-actions">
      <div class="live"><span class="dot"></span> Postazione attiva</div>
      <div id="wakeStatus" class="wake-status pending" title="Stato blocco schermo">Schermo: verifica…</div>
      <button class="fullscreen-btn" id="fullscreenBtn" type="button">⛶ Schermo intero</button></div>
  </header>

  <section class="main" id="mainContent">

<script>
let sent=false, resetTimer=null;
const RESET_AFTER_MS=3000;
function restartBar(){const b=document.getElementById('resetBarFill');if(!b)return;b.style.animation='none';void b.offsetWidth;b.style.animation='';}
function finishReset(animate=true){
 const form=document.getElementById('checkinForm'), input=document.getElementById('activityInput'), success=document.getElementById('successScreen'), selected=document.getElementById('selectedActivity'), main=document.getElementById('mainContent');
 success.classList.remove('show','leaving');selected.textContent='';input.value='';form.reset();document.querySelectorAll('.choice').forEach(b=>b.disabled=false);sent=false;
 main.classList.remove('returning');if(animate){void main.offsetWidth;main.classList.add('returning');setTimeout(()=>main.classList.remove('returning'),900);}
}
function resetCheckinUI(animate=true){const s=document.getElementById('successScreen');if(animate&&s.classList.contains('show')){s.classList.add('leaving');setTimeout(()=>finishReset(true),270);}else finishReset(false);}
function submitCheckin(activity){
 if(sent)return;sent=true;
 const form=document.getElementById('checkinForm'), input=document.getElementById('activityInput'), success=document.getElementById('successScreen'), selected=document.getElementById('selectedActivity');
 input.value=activity;selected.textContent=(activity==='Sala pesi'?'🏋️ ':'🥋 ')+activity;document.querySelectorAll('.choice').forEach(b=>b.disabled=true);restartBar();form.submit();
 setTimeout(()=>success.classList.add('show'),120);clearTimeout(resetTimer);resetTimer=setTimeout(()=>resetCheckinUI(true),RESET_AFTER_MS);
}
async function enterFullscreen(){const r=document.documentElement;try{if(r.requestFullscreen)await r.requestFullscreen({navigationUI:'hide'});else if(r.webkitRequestFullscreen)r.webkitRequestFullscreen();}catch(e){alert('Chrome ha bloccato lo schermo intero. Riprova toccando il pulsante.');}}
const fs=document.getElementById('fullscreenBtn');fs.addEventListener('click',enterFullscreen);document.addEventListener('fullscreenchange',()=>fs.classList.toggle('hidden',!!document.fullscreenElement));
function updateClock(){const n=new Date();document.getElementById('clock').textContent=n.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});document.getElementById('dateDisplay').textContent=n.toLocaleDateString('it-IT',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'}).replace(',','');}
updateClock();setInterval(updateClock,1000);window.addEventListener('pageshow',()=>finishReset(false));

// Mantiene lo schermo attivo e impedisce l'attenuazione automatica quando supportato dal browser.
let screenWakeLock=null;

function setWakeStatus(state, text){
  const el=document.getElementById('wakeStatus');
  if(!el) return;
  el.classList.remove('ok','warn','pending');
  el.classList.add(state);
  el.textContent=text;
}

async function requestScreenWakeLock(){
  if(!('wakeLock' in navigator)){
    setWakeStatus('warn','Schermo: non supportato');
    return;
  }
  try{
    if(screenWakeLock && !screenWakeLock.released){
      setWakeStatus('ok','Schermo attivo ✓');
      return;
    }
    setWakeStatus('pending','Schermo: verifica…');
    screenWakeLock=await navigator.wakeLock.request('screen');
    setWakeStatus('ok','Schermo attivo ✓');
    screenWakeLock.addEventListener('release',()=>{
      screenWakeLock=null;
      setWakeStatus('warn','Schermo: lock perso');
    });
  }catch(err){
    console.warn('Wake Lock non disponibile:',err);
    setWakeStatus('warn','Schermo: lock assente');
  }
}

// Prova subito e riprova quando la pagina torna in primo piano.
requestScreenWakeLock();
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible') requestScreenWakeLock();
});
window.addEventListener('focus',requestScreenWakeLock);
window.addEventListener('pageshow',requestScreenWakeLock);
// Un tocco dell'utente aiuta sui browser che richiedono un'interazione iniziale.
document.addEventListener('pointerdown',requestScreenWakeLock,{passive:true});
</script>
